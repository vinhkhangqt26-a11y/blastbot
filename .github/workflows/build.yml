          package com.nyx.blastbot

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private val h = Handler(Looper.getMainLooper())
              private var lastMod = 0L
              private lateinit var dbg: ImageView
              private lateinit var dbgLab: TextView
              private lateinit var resBox: LinearLayout

              // The live debug image refreshes by itself whenever a new one is saved.
              private val poll = object : Runnable {
                  override fun run() { refreshDebug(); h.postDelayed(this, 1000) }
              }
              private fun refreshDebug() {
                  val f = File(getExternalFilesDir(null), "debug.jpg")
                  if (f.exists() && f.lastModified() != lastMod) {
                      lastMod = f.lastModified()
                      BitmapFactory.decodeFile(f.path, BitmapFactory.Options().apply { inSampleSize = 2 })?.let { dbg.setImageBitmap(it) }
                      dbgLab.text = "Anh debug moi nhat (tu cap nhat): " + SimpleDateFormat("HH:mm:ss", Locale.US).format(Date(lastMod))
                  }
              }
              override fun onResume() { super.onResume(); h.post(poll) }
              override fun onPause() { super.onPause(); h.removeCallbacks(poll) }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val cfg = Cfg(this)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 64, 32, 32) }
                  fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() } }.also { root.addView(it) }
                  root.addView(TextView(this).apply {
                      text = "BlastBot\n1) Bat Tro nang cho BlastBot\n2) Bam BAT DAU, roi mo Block Blast\n3) Tren man hinh game co nut BAT DAU / DUNG noi"
                  })
                  btn("Mo cai dat Tro nang") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  btn("BAT DAU") {
                      val svc = BotService.inst
                      if (svc == null) Toast.makeText(this, "Chua bat dich vu Tro nang", Toast.LENGTH_LONG).show()
                      else { svc.setPlaying(true); Toast.makeText(this, "Da bat dau. Mo Block Blast de bot tu choi.", Toast.LENGTH_LONG).show() }
                  }
                  btn("DUNG") { BotService.inst?.setPlaying(false) }

                  val lab = TextView(this).apply { text = "Thoi gian moi buoc: ${cfg.sec} giay (1-60)" }
                  root.addView(lab)
                  root.addView(SeekBar(this).apply {
                      max = 59; progress = cfg.sec - 1
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar, v: Int, user: Boolean) { cfg.sec = v + 1; lab.text = "Thoi gian moi buoc: ${v + 1} giay (1-60)" }
                          override fun onStartTrackingTouch(sb: SeekBar) {}
                          override fun onStopTrackingTouch(sb: SeekBar) {}
                      })
                  })
                  root.addView(Switch(this).apply {
                      text = "Luu anh debug moi lan chup"; isChecked = cfg.live; setOnCheckedChangeListener { _, v -> cfg.live = v }
                  })

                  val labels = mapOf("bl" to "le trai ban (x/rong man)", "bt" to "dinh ban (y/cao man)", "bs" to "do rong ban (/rong man)",
                      "ty" to "dinh khay khoi (y/cao man)", "th" to "cao khay khoi", "ps" to "ti le o khoi trong khay so voi ban",
                      "dy" to "lech tha theo Y (don vi o, vd -1 hoac 1.5)")
                  val pk = EditText(this).apply { setText(cfg.pkg) }
                  root.addView(TextView(this).apply { text = "package game" }); root.addView(pk)
                  val ed = HashMap<String, EditText>()
                  for (k in cfg.defaults.keys) {
                      root.addView(TextView(this).apply { text = "$k: ${labels[k]}" })
                      ed[k] = EditText(this).apply {
                          setText(cfg.f(k).toString())
                          inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL or InputType.TYPE_NUMBER_FLAG_SIGNED
                      }.also { root.addView(it) }
                  }
                  btn("Luu") {
                      cfg.pkg = pk.text.toString().trim()
                      cfg.lx = 0f; cfg.ly = 0f   // forget learned drop offsets when settings change
                      ed.forEach { (k, e) -> e.text.toString().toFloatOrNull()?.let { cfg.set(k, it) } }
                      Toast.makeText(this, "Da luu", Toast.LENGTH_SHORT).show()
                  }
                  btn("Chup thu (sau 6s, hay chuyen sang Block Blast)") {
                      BotService.inst?.debugShot() ?: Toast.makeText(this, "Chua bat dich vu Tro nang", Toast.LENGTH_LONG).show()
                  }

                  // Analyse a screenshot from the gallery: one result image per piece left in the tray (0-3).
                  btn("Them anh de phan tich") {
                      startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).apply { type = "image/*" }, 7)
                  }
                  resBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(resBox)

                  dbgLab = TextView(this).apply { text = "Chua co anh debug" }
                  root.addView(dbgLab)
                  dbg = ImageView(this).apply { adjustViewBounds = true }
                  root.addView(dbg)
                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req != 7 || res != RESULT_OK) return
                  val uri = data?.data ?: return
                  resBox.removeAllViews()
                  fun say(t: String) = resBox.addView(TextView(this).apply { text = t })
                  val bmp = try { contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it) } } catch (e: Exception) { null }
                  if (bmp == null) { say("Khong doc duoc anh"); return }
                  val cfg = Cfg(this)
                  val v = Vision(bmp, cfg); val g = v.board(); val ps = v.pieces()
                  val n = ps.count { it != null }
                  val plan = if (n > 0) Solver.plan(g, ps) else null
                  val k = plan?.size ?: 0
                  say("Thay $n khoi trong khay, co $k anh ket qua." + if (n > k) " (co khoi khong dat duoc)" else "")
                  for (i in 0 until k) {
                      val r = Overlay.render(bmp, cfg, v, g, ps, plan, i, "Anh ${i + 1}/$k")
                      try { File(getExternalFilesDir(null), "analysis_${i + 1}.jpg").outputStream().use { r.compress(Bitmap.CompressFormat.JPEG, 85, it) } } catch (e: Exception) {}
                      val small = Bitmap.createScaledBitmap(r, 540, (r.height * 540f / r.width).toInt(), true)
                      resBox.addView(ImageView(this).apply { adjustViewBounds = true; setImageBitmap(small) })
                  }
              }
          }
          EOF_4
